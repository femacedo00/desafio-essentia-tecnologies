services:
  # Banco MySQL
  mysql-db:
    image: mysql:8.0 # Versão estável
    container_name: essentia-tecnologies-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} # Senha através do .env
      MYSQL_DATABASE: ${DB_NAME} # Nome através do .env
    ports:
      - "${DB_MYSQL_PORT}:3306" # Mapeamento da porta
    volumes:
      - mysql_data:/var/lib/mysql

  # Banco MongoDB
  mongodb:
    image: mongo:latest # Imagem oficial atualizada
    container_name: essentia-tecnologies-mongodb
    restart: unless-stopped
    ports:
      - "${DB_MONGO_PORT}:27017" # Mapeamento da porta
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
