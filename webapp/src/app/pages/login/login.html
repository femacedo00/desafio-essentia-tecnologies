<div class="login-container">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <h2>Acessar Sistema</h2>

        @if (errorMessage) {
        <div class="alert-error">{{ errorMessage }}</div>
        }

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" formControlName="email" placeholder="Seu e-mail">
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" formControlName="password" placeholder="Sua senha">
        </div>

        <button type="submit" [disabled]="loginForm.invalid">Entrar</button>

        <p>Não tem uma conta? <a routerLink="/register">Cadastre-se aqui</a></p>
    </form>
</div>
