<div class="dashboard-wrapper">

    <header class="dashboard-header">
        <div class="header-brand">
            <h2>Gestão de Tarefas</h2>
        </div>
        <button class="btn-logout" (click)="onLogout()">
            <span>Sair do Sistema</span>
        </button>
    </header>

    <div class="dashboard-content">

        <aside class="sidebar-form">
            <h3>Nova Tarefa</h3>
            <form [formGroup]="taskForm" (ngSubmit)="onCreateTask()">

                <div class="form-group">
                    <label for="title">Título</label>
                    <input type="text" id="title" formControlName="title" placeholder="Ex: Estudar Angular 18">
                </div>

                <div class="form-group">
                    <label for="description">Descrição (Opcional)</label>
                    <textarea id="description" formControlName="description" placeholder="Detalhes sobre a atividade..."
                        rows="4"></textarea>
                </div>

                <button type="submit" [disabled]="taskForm.invalid">
                    Adicionar Tarefa
                </button>
            </form>
        </aside>

        <main class="tasks-main">
            <h3>Minhas Atividades</h3>

            <div class="tasks-list">
                @for (task of (taskService.tasks$ | async); track task.id) {

                <div class="task-card" [ngClass]="{ 'is-completed': task.completed }">
                    <div class="task-info">
                        <div class="task-header-row">
                            <input type="checkbox" [checked]="task.completed" (change)="onToggleComplete(task)"
                                class="task-checkbox">
                            <h4 class="task-title">{{ task.title }}</h4>
                        </div>
                        @if (task.description) {
                        <p class="task-desc">{{ task.description }}</p>
                        }
                    </div>

                    <div class="task-actions">
                        <button class="btn-delete" (click)="onDeleteTask(task.id)" title="Excluir tarefa">
                            Excluir
                        </button>
                    </div>
                </div>

                } @empty {
                <div class="empty-state">
                    <p>Nenhuma tarefa cadastrada por enquanto.</p>
                </div>
                }
            </div>
        </main>

    </div>
</div>
