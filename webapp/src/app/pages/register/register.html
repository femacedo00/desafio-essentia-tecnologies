<div class="auth-container">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <h2>Criar Nova Conta</h2>

        @if (errorMessage) {
        <div class="alert-error">{{ errorMessage }}</div>
        }

        @if (successMessage) {
        <div class="alert-success">{{ successMessage }}</div>
        }

        <div class="form-group">
            <label for="name">Nome Completo</label>
            <input type="text" id="name" formControlName="name" placeholder="Seu nome">
        </div>

        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" formControlName="email" placeholder="Seu melhor e-mail">
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" formControlName="password" placeholder="Mínimo 6 caracteres">
        </div>

        <button type="submit" [disabled]="registerForm.invalid">Cadastrar</button>

        <p>Já tem uma conta? <a routerLink="/login">Faça login aqui</a></p>
    </form>
</div>
